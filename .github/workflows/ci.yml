name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: fix-core coverage (>= 90% lines)
        run: npm run coverage:core
      - name: Build
        run: npm run build
      - name: End-to-end (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
